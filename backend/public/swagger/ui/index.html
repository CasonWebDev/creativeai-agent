<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreativeAI Agent API - Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fafafa;
        }

        .topbar {
            background-color: #222;
            padding: 10px 0;
            text-align: center;
        }

        .topbar-title {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        .swagger-ui {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1 class="topbar-title">CreativeAI Agent API Documentation</h1>
    </div>
    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
        window.onload = function () {
            const ui = SwaggerUIBundle({
                url: "../openapi.json",
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout",
                requestInterceptor: (request) => {
                    request.headers['X-Requested-With'] = 'XMLHttpRequest';
                    return request;
                },
                onComplete: function () {
                    console.log("Swagger UI loaded successfully");
                }
            });
            window.ui = ui;
        }
    </script>
</body>
</html>
