version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creativeai-app
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=creativeai_auth
      - DB_USERNAME=creativeai
      - DB_PASSWORD=change_me_in_production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "9000:9000"
    depends_on:
      - db
      - redis
      - mailhog
    networks:
      - creativeai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: creativeai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: creativeai_auth
      POSTGRES_USER: creativeai
      POSTGRES_PASSWORD: change_me_in_production
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - creativeai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creativeai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: creativeai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - creativeai
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailhog for Email Testing (Local Development)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: creativeai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - creativeai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Web Server (Optional - for local development)
  nginx:
    image: nginx:alpine
    container_name: creativeai-nginx
    restart: unless-stopped
    volumes:
      - .:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - app
    networks:
      - creativeai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  creativeai:
    driver: bridge
