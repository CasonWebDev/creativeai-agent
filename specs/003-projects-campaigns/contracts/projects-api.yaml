openapi: 3.0.3
info:
  title: Projects & Campaigns API
  description: RESTful API for digital media project and campaign management
  version: 1.0.0
  contact:
    name: CreativeAI Agent Team

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.creativeai-agent.com/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Projects
    description: Project CRUD operations
  - name: Campaigns
    description: Campaign management within projects
  - name: Briefs
    description: Campaign brief editing and auto-save
  - name: Collaborators
    description: Project collaboration management
  - name: Tags
    description: Project organization via tags
  - name: Files
    description: File upload and storage quota management

paths:
  /projects:
    get:
      tags: [Projects]
      summary: List user's projects
      description: Returns paginated list of projects accessible by authenticated user (owned + collaborated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: status
          in: query
          description: Filter by project status
          schema:
            type: string
            enum: [draft, active, archived]
        - name: tags
          in: query
          description: Filter by tag names (comma-separated)
          schema:
            type: string
            example: "client-x,urgent"
        - name: sort
          in: query
          description: Sort order
          schema:
            type: string
            enum: [created_at, updated_at, name]
            default: updated_at
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Projects list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      tags: [Projects]
      summary: Create new project
      description: Creates project for authenticated user (enforces tier limits)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Tier limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "You've reached your plan's project limit (5 projects for Free tier)"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get project details
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    
    put:
      tags: [Projects]
      summary: Update project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    
    delete:
      tags: [Projects]
      summary: Archive project (soft delete)
      description: Soft-deletes project with 30-day recovery window
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Project archived successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{id}/duplicate:
    post:
      tags: [Projects]
      summary: Duplicate project
      description: Creates copy of project with all campaigns and assets
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Name for duplicated project
                  example: "Copy of Spring Campaign 2025"
      responses:
        '201':
          description: Project duplicated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Insufficient permissions or tier limit reached

  /projects/{id}/export:
    get:
      tags: [Projects]
      summary: Export project as JSON
      description: Returns project with all campaigns, briefs, and asset metadata as JSON
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project data exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectExport'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/restore:
    post:
      tags: [Projects]
      summary: Restore archived project
      description: Restores soft-deleted project within 30-day window
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '404':
          description: Project not found or recovery window expired
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/search:
    get:
      tags: [Projects]
      summary: Full-text search projects
      description: Searches across project name, description, and client fields (p95 < 300ms)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query
          example: "summer campaign client-x"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Search results retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Invalid search query

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /auth/login endpoint (existing auth system)

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Project ID
    
    CampaignId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Campaign ID

  schemas:
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 42
        user_id:
          type: integer
          format: int64
          description: Owner user ID
        name:
          type: string
          maxLength: 100
          example: "Spring Campaign 2025"
        description:
          type: string
          nullable: true
          example: "Social media campaign for spring product launch"
        client:
          type: string
          nullable: true
          example: "Client X Corp"
        deadline:
          type: string
          format: date
          nullable: true
          example: "2025-03-31"
        status:
          type: string
          enum: [draft, active, archived]
          example: "active"
        campaign_count:
          type: integer
          description: Number of campaigns in project
          example: 5
        tags:
          type: array
          items:
            type: string
          example: ["urgent", "client-x"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            campaigns:
              type: array
              items:
                $ref: '#/components/schemas/Campaign'
            collaborators:
              type: array
              items:
                $ref: '#/components/schemas/Collaborator'
            statistics:
              type: object
              properties:
                total_campaigns:
                  type: integer
                total_assets:
                  type: integer
                avg_generation_time_ms:
                  type: number
                  format: float
                storage_used_bytes:
                  type: integer
                  format: int64

    Campaign:
      type: object
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        name:
          type: string
          example: "Instagram Awareness - Q1"
        objective:
          type: string
          enum: [awareness, conversion, engagement]
        target_audience:
          type: string
          nullable: true
        tone_of_voice:
          type: string
          nullable: true
          example: "professional"
        platforms:
          type: array
          items:
            type: string
            enum: [Instagram, Facebook, LinkedIn, TikTok, YouTube, Twitter]
          example: ["Instagram", "Facebook"]
        image_dimensions:
          type: array
          items:
            type: string
          example: ["1080x1080", "1920x1080"]
        briefing:
          type: string
          minLength: 50
          maxLength: 2000
        status:
          type: string
          enum: [draft, in_production, completed]
        version:
          type: integer
          description: Current version number
        asset_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Collaborator:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
        invited_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        client:
          type: string
          maxLength: 255
        deadline:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
            maxLength: 50

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        client:
          type: string
          maxLength: 255
        deadline:
          type: string
          format: date
        status:
          type: string
          enum: [draft, active, archived]

    ProjectExport:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        campaigns:
          type: array
          items:
            type: object
            properties:
              campaign:
                $ref: '#/components/schemas/Campaign'
              brief:
                type: object
              assets:
                type: array
                items:
                  type: object

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Unauthenticated"
    
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "You do not have permission to perform this action"
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Project not found"
    
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "The given data was invalid"
            errors:
              name: ["The name field is required"]
